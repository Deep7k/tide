[package]
name = "tide"
version = "0.2.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
nvml-wrapper = "0.13.0"
ratatui = "0.30.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
toml = "1.1.8"
windows = { version = "0.62.2", features = [
    "Foundation",
    "Media_Control",
    "Wdk_Graphics_Direct3D",
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
# One optimisation unit across all crates, no debug symbols: smaller, faster exe.
lto = true
codegen-units = 1
strip = true
# A panic anywhere (including the audio/stats/media threads) restores the
# terminal in the panic hook and exits, instead of leaving the UI half-running.
panic = "abort"
